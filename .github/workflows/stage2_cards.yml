name: "Stage 2 - 카드 생성 + 카드 승인 요청"

on:
  repository_dispatch:
    types: [article_approved]
  workflow_dispatch:
    inputs:
      slot:
        description: "슬롯 (테스트/수동 실행용)"
        required: true
        type: choice
        options: [morning, lunch, evening, night]

env:
  PYTHONIOENCODING: "utf-8"

jobs:
  build-cards:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write  # 슬롯별 캐시 키 재저장 전 기존 키 삭제(gh cache delete)에 필요
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      BRAND_NAME: ${{ secrets.BRAND_NAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: Playwright 브라우저 설치 (카드 이미지 렌더링용)
        run: playwright install --with-deps chromium

      - name: D 드라이브 출력 폴더 준비
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "D:/Dotory/Cardnews/output" | Out-Null

      - name: 슬롯 결정 (dispatch payload 또는 수동 입력)
        id: slot
        uses: ./.github/actions/extract-dispatch
        with:
          manual_slot: ${{ inputs.slot }}

      # 주의: 이전 Stage 1 실행이 만든 D:/Dotory/Cardnews/output/<날짜>/ 데이터가 이
      # 러너에 남아있어야 한다. GitHub-hosted 러너는 매 job마다 새 VM이라 상태가
      # 유지되지 않으므로, actions/cache로 오늘자 산출물 폴더를 복원한다.
      - name: 오늘자 산출물 복원 (Stage 1 캐시)
        uses: actions/cache/restore@v4
        with:
          path: |
            D:/Dotory/Cardnews/output
            web/v2/img
          key: dotory-output-${{ github.run_id }}-nokey  # 아래 restore-keys로 최신 일치 항목을 사용
          restore-keys: |
            dotory-output-

      - name: KST 날짜 계산 (슬롯별 캐시 키용)
        id: kst
        uses: ./.github/actions/kst-date
        with:
          slot: ${{ steps.slot.outputs.slot }}

      - name: 카드 5장 생성 (main.py --dry-run 재사용 — 배포/업로드 없음)
        shell: pwsh
        run: |
          python -X utf8 main.py --slot ${{ steps.slot.outputs.slot }} --dry-run

      - name: 산출물 캐시 저장 (Stage 3에서 이어받기 위함)
        uses: actions/cache/save@v4
        with:
          path: |
            D:/Dotory/Cardnews/output
            web/v2/img
          key: dotory-output-${{ github.run_id }}

      # 2026-08-16: 위 run_id 키는 "이 실행의 스냅샷"일 뿐, Stage 3(및 재생성 워크플로우들)가
      # "이 슬롯의 최신 데이터"를 찾을 방법이 없었음 — prefix 기반 restore-keys가 "가장 최근에
      # 저장된 캐시"를 고르다 보니, 다른 슬롯이 그 사이 먼저 실행되면 엉뚱한 슬롯 데이터를
      # 가져와 승인이 늦어진 슬롯을 나중에 재시도하면 "v2 데이터 없음"으로 실패하는 사고가
      # 있었음. 날짜+슬롯으로 고정된 키를 별도로 유지해서 항상 정확히 찾아지게 한다.
      # GitHub Actions 캐시는 같은 키로 덮어쓰기가 안 되므로, 재생성(card_regen 등)으로 이
      # 키가 이미 있을 수 있어 먼저 지우고 다시 저장한다(처음 있는 게 정상이라 실패 무시).
      - name: 슬롯별 캐시 키 갱신 (날짜+슬롯 고정 키)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_KEY: dotory-output-${{ steps.kst.outputs.date }}-${{ steps.slot.outputs.slot }}
        run: |
          gh cache delete "$env:CACHE_KEY" --repo ${{ github.repository }} 2>$null
          exit 0

      - name: 슬롯별 캐시 저장 (날짜+슬롯 고정 키)
        uses: actions/cache/save@v4
        with:
          path: |
            D:/Dotory/Cardnews/output
            web/v2/img
          key: dotory-output-${{ steps.kst.outputs.date }}-${{ steps.slot.outputs.slot }}

      - name: 텔레그램 카드 승인 요청 전송
        shell: pwsh
        run: |
          python cloud/telegram_gate.py send-cards --slot ${{ steps.slot.outputs.slot }}
