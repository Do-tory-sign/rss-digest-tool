name: "카드 1장 재생성"

on:
  repository_dispatch:
    types: [card_regen]

env:
  PYTHONIOENCODING: "utf-8"

jobs:
  regen-one-card:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write  # 슬롯별 캐시 키 재저장 전 기존 키 삭제(gh cache delete)에 필요
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      BRAND_NAME: ${{ secrets.BRAND_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium

      - name: D 드라이브 출력 폴더 준비
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "D:/Dotory/Cardnews/output" | Out-Null

      - name: 슬롯/카드명 추출
        id: p
        uses: ./.github/actions/extract-dispatch
        with:
          extra_key: extra

      - name: KST 날짜 계산 (슬롯별 캐시 키용)
        id: kst
        uses: ./.github/actions/kst-date
        with:
          slot: ${{ steps.p.outputs.slot }}

      # 2026-08-16: prefix 기반 restore-keys("가장 최근 저장된 캐시")는 다른 슬롯이 그 사이
      # 먼저 돌면 엉뚱한 슬롯 데이터를 가져옴 — 날짜+슬롯 고정 키를 우선 사용하고, 옛날
      # 데이터(고정 키 도입 전 실행)를 위해 prefix를 폴백으로만 둔다.
      - name: 이 슬롯의 최신 산출물 복원
        uses: actions/cache/restore@v4
        with:
          path: |
            D:/Dotory/Cardnews/output
            web/v2/img
          key: dotory-output-${{ steps.kst.outputs.date }}-${{ steps.p.outputs.slot }}
          restore-keys: |
            dotory-output-

      - name: 카드 재생성 + 재전송 (main.py의 regenerate_single_card 재사용)
        shell: pwsh
        env:
          SLOT: ${{ steps.p.outputs.slot }}
          CARD: ${{ steps.p.outputs.extra }}
        run: |
          python cloud/regen_card_and_notify.py --slot $env:SLOT --card $env:CARD

      - name: 갱신된 산출물 재저장
        uses: actions/cache/save@v4
        with:
          path: |
            D:/Dotory/Cardnews/output
            web/v2/img
          key: dotory-output-${{ github.run_id }}

      - name: 슬롯별 캐시 키 갱신 (날짜+슬롯 고정 키)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_KEY: dotory-output-${{ steps.kst.outputs.date }}-${{ steps.p.outputs.slot }}
        run: |
          gh cache delete "$env:CACHE_KEY" --repo ${{ github.repository }} 2>$null
          exit 0

      - name: 슬롯별 캐시 저장 (날짜+슬롯 고정 키)
        uses: actions/cache/save@v4
        with:
          path: |
            D:/Dotory/Cardnews/output
            web/v2/img
          key: dotory-output-${{ steps.kst.outputs.date }}-${{ steps.p.outputs.slot }}
